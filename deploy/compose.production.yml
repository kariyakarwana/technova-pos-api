name: technova-pos-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16.15-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    networks: [technova]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    networks: [technova]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-technova-public}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-technova-private}
    entrypoint: >-
      /bin/sh -ec '
      until /usr/bin/mc alias set local http://minio:9000
      "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing "local/$$MINIO_PUBLIC_BUCKET";
      /usr/bin/mc mb --ignore-existing "local/$$MINIO_PRIVATE_BUCKET";
      /usr/bin/mc anonymous set download "local/$$MINIO_PUBLIC_BUCKET";
      /usr/bin/mc anonymous set none "local/$$MINIO_PRIVATE_BUCKET";
      /usr/bin/mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" || true;
      /usr/bin/mc admin policy attach local readwrite --user "$$MINIO_ACCESS_KEY";
      '
    restart: "no"
    logging: *default-logging
    networks: [technova]

  ai-service:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    restart: unless-stopped
    environment:
      TECHNOVA_AI_DATA_DIR: /app/data
      TECHNOVA_AI_ARTIFACT_DIR: /app/artifacts
    volumes:
      - /srv/technova/ai/artifacts:/app/artifacts:ro
      - /srv/technova/ai/data/processed:/app/data/processed:ro
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    init: true
    networks: [technova]

  migrate:
    image: ${BACKEND_MIGRATE_IMAGE:?BACKEND_MIGRATE_IMAGE is required}
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: ${TECHNOVA_ENV_FILE:-/etc/technova/production.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]
    restart: "no"
    logging: *default-logging
    networks: [technova]

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    env_file: ${TECHNOVA_ENV_FILE:-/etc/technova/production.env}
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AI_SERVICE_URL: http://ai-service:8000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL is required}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    init: true
    networks: [technova]

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://backend:4000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    init: true
    networks: [technova]

networks:
  technova:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
