name: technova-pos

services:
  postgres:
    image: postgres:16-alpine
    container_name: technova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: technova_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - technova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d technova_pos"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: technova-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-technova-public}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-technova-private}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/$$MINIO_PUBLIC_BUCKET;
      /usr/bin/mc mb --ignore-existing local/$$MINIO_PRIVATE_BUCKET;
      /usr/bin/mc anonymous set download local/$$MINIO_PUBLIC_BUCKET;
      /usr/bin/mc admin user add local $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY || true;
      /usr/bin/mc admin policy attach local readwrite --user $$MINIO_ACCESS_KEY;
      exit 0;
      "

volumes:
  technova_postgres_data:
  minio_data:
